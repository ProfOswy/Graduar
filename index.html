<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduar — ENADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfbf4; --desk:#e9e4d6; --line:#c9daf0; --margin:#e8838a; --ink:#1d2b4f; --pencil:#5f6673;
  --muted:#6b7280; --acc:#1f4fa3; --acc2:#fff4a3; --mark:#ffe94d; --ok:#1d7a44; --okbg:#e3f5e7; --bad:#c0392b; --badbg:#fde8e5;
  --card:#fffdf7; --base:#f6f3ea; --hole:#e9e4d6; --tape:rgba(255,235,150,.75); --shadow:0 2px 0 rgba(0,0,0,.05),0 10px 24px -14px rgba(40,30,10,.35);
  --pB:#fff3a8; --pP:#ffd6e3; --pG:#d7f5d0; --pA:#cfe6ff; --pL:#ffe0b8;
}
:root[data-theme="dark"]{
  --paper:#1d2621; --desk:#141a17; --line:rgba(255,255,255,.06); --margin:rgba(232,131,138,.45); --ink:#eef2ec; --pencil:#a7b3ab;
  --muted:#a7b3ab; --acc:#9ccaff; --acc2:rgba(255,233,77,.18); --mark:rgba(255,233,77,.35); --ok:#7fe0a3; --okbg:rgba(127,224,163,.12); --bad:#ff9a8c; --badbg:rgba(255,154,140,.12);
  --card:#222d27; --base:#1a221e; --hole:#141a17; --tape:rgba(255,235,150,.22); --shadow:0 10px 24px -14px rgba(0,0,0,.8);
  --pB:#4a4628; --pP:#4a3040; --pG:#2f4a33; --pA:#2b3d55; --pL:#4c3a26;
}
*{box-sizing:border-box}
html{background:var(--desk)}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.6;min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 40%),
    var(--desk)}
/* fórmulas a lápis no fundo */
.bgf{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgf span{position:absolute;font-family:'Kalam',cursive;color:var(--pencil);opacity:.13;white-space:nowrap;user-select:none}
/* folha do caderno */
.wrap{position:relative;z-index:1;max-width:900px;margin:22px auto 40px;padding:26px 30px 40px 82px;
  background:
    linear-gradient(90deg,transparent 62px,var(--margin) 62px,var(--margin) 64px,transparent 64px),
    repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px),
    var(--paper);
  border-radius:6px 10px 10px 6px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 24px 50px -24px rgba(40,30,10,.45)}
/* espiral */
.wrap::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:26px;
  background:radial-gradient(circle at 13px 13px,var(--hole) 0 7px,rgba(0,0,0,.18) 7px 8px,transparent 8.5px) 0 0/26px 40px repeat-y}
.wrap::after{content:"";position:absolute;left:4px;top:18px;bottom:18px;width:22px;
  background:linear-gradient(90deg,transparent 0 3px,#9aa3ad 3px 6px,#d5dbe1 6px 8px,#8a939d 8px 10px,transparent 10px) 0 6px/22px 40px repeat-y;
  -webkit-mask:repeating-linear-gradient(transparent 0 6px,#000 6px 20px,transparent 20px 40px);mask:repeating-linear-gradient(transparent 0 6px,#000 6px 20px,transparent 20px 40px);opacity:.9}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;position:relative}
h1{font-family:'Kalam',cursive;font-weight:700;font-size:3.1rem;margin:0;line-height:1;color:var(--ink);display:inline-block;position:relative;transform:rotate(-1.5deg)}
h1::after{content:"";position:absolute;left:-6px;right:-10px;bottom:4px;height:.42em;background:var(--mark);z-index:-1;border-radius:3px 8px 4px 10px;transform:skewX(-8deg)}
h1 small{font-size:.38em;color:var(--acc);margin-left:8px;font-weight:400}
.sub{color:var(--pencil);font-size:1.05rem;margin-top:8px;font-family:'Kalam',cursive}
.credit{font-size:.82rem;color:var(--muted);margin-top:2px}
.credit a,footer a{color:var(--acc)}
.doodle{position:absolute;right:120px;top:-6px;width:150px;opacity:.75;pointer-events:none}
.iconbtn{background:var(--card);border:1.5px dashed var(--pencil);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;font-family:'Kalam',cursive;font-size:.95rem;transform:rotate(2deg)}
.iconbtn:hover{transform:rotate(0)}
/* cartões = folhas presas com fita */
.card{position:relative;background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:4px;padding:24px 22px 20px;margin:0 0 22px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;margin-left:-48px;background:var(--tape);transform:rotate(-2.5deg);box-shadow:0 1px 2px rgba(0,0,0,.08);clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 50%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px;margin-bottom:10px}
/* post-its */
.mode{cursor:pointer;text-align:left;border:0;border-radius:2px 2px 18px 2px;padding:20px 18px 22px;font:inherit;color:var(--ink);transition:transform .15s;box-shadow:0 12px 18px -12px rgba(40,30,10,.5);position:relative;min-height:150px}
.mode:nth-child(1){background:var(--pB);transform:rotate(-2deg)}
.mode:nth-child(2){background:var(--pP);transform:rotate(1.5deg)}
.mode:nth-child(3){background:var(--pG);transform:rotate(-1deg)}
.mode:nth-child(4){background:var(--pA);transform:rotate(2deg)}
.mode:nth-child(5){background:var(--pL);transform:rotate(-1.5deg)}
.mode:nth-child(6){background:var(--pB);transform:rotate(1deg)}
.mode:hover{transform:rotate(0) translateY(-4px) scale(1.02)}
.mode::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a80,#c62828);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.mode b{display:block;font-family:'Kalam',cursive;font-size:1.45rem;margin-bottom:4px;line-height:1.1}
.mode span{font-size:.9rem;opacity:.85}
h2{font-family:'Kalam',cursive;font-size:1.7rem;margin:0 0 10px;font-weight:700;color:var(--ink)}
h3{font-family:'Kalam',cursive;font-size:1.15rem;margin:18px 0 8px;color:var(--acc);font-weight:400}
h3::before{content:"✎ ";opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--pencil);background:transparent;color:var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:6px 15px;cursor:pointer;font-family:'Kalam',cursive;font-size:1rem}
.chip.on{background:var(--mark);border-color:var(--ink);font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:10px 22px;font-family:'Kalam',cursive;font-size:1.15rem;font-weight:700;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
:root[data-theme="dark"] .btn{color:#10201a}
.btn:hover{box-shadow:3px 4px 0 var(--ink);filter:brightness(1.08)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.ghost,:root[data-theme="dark"] .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
input[type=text],textarea{width:100%;padding:8px 10px;border:0;border-bottom:2px solid var(--pencil);border-radius:0;background:transparent;color:var(--ink);font-family:'Kalam',cursive;font-size:1.1rem;outline:none}
input[type=text]:focus,textarea:focus{border-bottom-color:var(--acc)}
textarea{min-height:200px;resize:vertical;line-height:32px;padding:0 6px;border:1px solid rgba(0,0,0,.08);
  background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-attachment:local}
.mono{font-family:'IBM Plex Mono',monospace}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;margin:0 6px 4px 0;font-family:'Kalam',cursive;font-size:.95rem;color:var(--ink);background:linear-gradient(transparent 35%,var(--mark) 35% 88%,transparent 88%)}
.tag:nth-child(2n){background:linear-gradient(transparent 35%,var(--pA) 35% 88%,transparent 88%)}
.tag:nth-child(3n){background:linear-gradient(transparent 35%,var(--pP) 35% 88%,transparent 88%)}
.timer{font-family:'IBM Plex Mono',monospace;font-size:.9rem;color:var(--pencil)}
.bar{height:8px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:18px;background:transparent}
.bar>i{display:block;height:100%;transition:width .3s;background:repeating-linear-gradient(-45deg,var(--acc) 0 6px,transparent 6px 10px)}
.base{position:relative;background:var(--base);border-left:3px solid var(--margin);padding:12px 16px 12px 18px;margin-bottom:14px;font-size:.97rem;border-radius:0 6px 6px 0}
.base small{display:block;color:var(--margin);font-family:'Kalam',cursive;font-size:.95rem;margin-bottom:2px;letter-spacing:.02em}
.base table td,.base table th{font-family:'IBM Plex Mono',monospace;font-size:.85rem}
.porque{text-align:center;font-weight:700;letter-spacing:.1em;margin:6px 0}
.enun{font-weight:500;margin:12px 0}
.alts{display:flex;flex-direction:column;gap:9px}
.alt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid transparent;border-bottom:1.5px dashed rgba(0,0,0,.15);background:transparent;color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit;transition:background .12s}
:root[data-theme="dark"] .alt{border-bottom-color:rgba(255,255,255,.12)}
.alt:hover{background:var(--acc2)}
.alt .l{flex:0 0 30px;height:30px;display:grid;place-items:center;font-family:'Kalam',cursive;font-weight:700;font-size:1.1rem;color:var(--acc);border:1.8px solid var(--acc);border-radius:50% 45% 52% 48%/48% 52% 45% 50%;margin-top:-2px}
.alt.sel{background:var(--acc2)}
.alt.sel .l{background:var(--acc);color:#fff}
.alt.ok{background:var(--okbg);border-color:var(--ok)}
.alt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.ok::after{content:"✔";font-family:'Kalam',cursive;color:var(--ok);font-size:1.5rem;margin-left:auto;line-height:1}
.alt.bad{background:var(--badbg);border-color:var(--bad)}
.alt.bad span:last-of-type{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.alt.bad .l{border-color:var(--bad);color:var(--bad);background:transparent}
.alt.bad::after{content:"✘";font-family:'Kalam',cursive;color:var(--bad);font-size:1.5rem;margin-left:auto;line-height:1}
.alt:disabled{cursor:default}
.coment{position:relative;margin-top:16px;padding:14px 16px;background:var(--pB);color:var(--ink);font-size:.94rem;box-shadow:0 10px 16px -12px rgba(40,30,10,.5);transform:rotate(-.4deg);border-radius:2px 2px 14px 2px}
:root[data-theme="dark"] .coment{color:var(--ink)}
.coment b:first-child{font-family:'Kalam',cursive;font-size:1.15rem}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:8px}
.stat{text-align:center;padding:10px 6px}
.stat b{display:inline-block;font-family:'Kalam',cursive;font-size:2.2rem;color:var(--bad);padding:0 14px;border:2.5px solid var(--bad);border-radius:50% 46% 52% 48%/55% 48% 52% 45%;transform:rotate(-3deg);line-height:1.3}
.stat:nth-child(n+2) b{color:var(--acc);border-color:var(--acc);transform:rotate(2deg)}
.stat span{display:block;font-size:.85rem;color:var(--pencil);margin-top:6px;font-family:'Kalam',cursive}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 6px;border-bottom:1px dashed rgba(0,0,0,.15);text-align:left}
:root[data-theme="dark"] td,:root[data-theme="dark"] th{border-bottom-color:rgba(255,255,255,.12)}
th{font-family:'Kalam',cursive;font-weight:700;color:var(--acc);font-size:1rem}
.mini{height:10px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;min-width:80px}
.mini i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--ok) 0 5px,transparent 5px 8px)}
details{border:0;border-bottom:1.5px dashed rgba(0,0,0,.15);padding:10px 4px;margin-bottom:4px}
summary{cursor:pointer;font-weight:500}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.note{font-size:.88rem;color:var(--pencil)}
.codebox{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;letter-spacing:.06em;text-align:center;padding:14px;border:2.5px dashed var(--acc);border-radius:12px;color:var(--acc);margin:12px 0;background:var(--acc2)}
.rub label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.15)}
.rub input{accent-color:var(--ok);width:18px;height:18px;margin-top:3px}
.hidden{display:none!important}
footer{margin-top:30px;font-size:.85rem;color:var(--pencil);text-align:center;font-family:'Kalam',cursive}
@media (max-width:640px){
  .wrap{margin:0;padding:18px 16px 30px 44px;border-radius:0;
    background:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 35px,transparent 35px),repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px),var(--paper)}
  .wrap::before{left:4px;width:22px;background-size:22px 36px}
  .wrap::after{display:none}
  h1{font-size:2.4rem}
  .doodle{display:none}
  .card{padding:20px 14px 16px}
  .mode{min-height:0}
}
@media print{.bgf,header .iconbtn,.row,footer,.noprint,.doodle{display:none!important}html,body{background:#fff}.wrap{box-shadow:none;background:#fff;padding-left:20px}.wrap::before,.wrap::after,.card::before{display:none}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="bgf" id="bgf"></div>
<div class="wrap">
<header>
  <div>
    <h1>Graduar</h1>
    <div class="sub" id="subCurso">questões no estilo ENADE</div>
    <div class="credit">Criado por: Prof. Me. Rodrigo Gonçalves (Prof Oswy) · <a href="https://youtube.com/@ProfOswy" target="_blank">youtube.com/@ProfOswy</a></div>
  </div>
  <svg class="doodle" viewBox="0 0 160 90" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pencil)" aria-hidden="true">
    <path d="M10 52 C40 50.5, 100 53, 150 51"/>

    <path d="M18 20 v28 M14 42 l4 7 4-7"/><path d="M45 20 v28 M41 42 l4 7 4-7"/><path d="M72 20 v28 M68 42 l4 7 4-7"/><path d="M99 20 v28 M95 42 l4 7 4-7"/><path d="M126 20 v28 M122 42 l4 7 4-7"/>

</header>

<main id="app"></main>

<footer>
  <a href="https://youtube.com/@ProfOswy" target="_blank">youtube.com/@ProfOswy</a> · profoswy@gmail.com · Instagram rodrigo.osw<br>

<script>
/* ================= RANKING ONLINE (Google Planilhas + Apps Script) =================
   Cole aqui a URL do App da Web gerada na implantação do Apps Script (termina em /exec).
   Deixe vazio para usar só o envio manual (copiar/colar ou WhatsApp). */
const API_URL='https://script.google.com/macros/s/AKfycbxnZS-mJdGg8BPwZ-6c7O0azbaA88K4FRh8BNDv37CStvPni2bRsgJgERUvimbzhwhkXw/exec';

function apiEnviar(dados){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(dados)})
    .then(r=>r.json());
}
function apiRanking(codigo){
  return fetch(API_URL+'?acao=ranking&codigo='+encodeURIComponent(codigo)+'&t='+Date.now()).then(r=>r.json());
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= utilidades ================= */
const app=document.getElementById('app');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R={
  int:(r,a,b)=>a+Math.floor(r()*(b-a+1)),
  pick:(r,arr)=>arr[Math.floor(r()*arr.length)],
  shuffle:(r,arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
};
const nf=(x,d=2)=>x.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const LET='ABCDE';
const fmtT=s=>{s=Math.round(s);const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')};
function hash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36).toUpperCase().padStart(6,'0').slice(-6)}

/* alternativas numéricas: correta + distratores de erros comuns */
function numQ(r,{correct,wrongs,dec=2,unit='',pre='',max=Infinity}){
  const f=v=>pre+nf(v,dec)+(unit?' '+unit:'');
  const cs=f(correct),seen=new Set([cs]),out=[cs];
  for(const w of wrongs){if(!isFinite(w)||w<=0||w>=max)continue;const s=f(w);if(!seen.has(s)){seen.add(s);out.push(s)}if(out.length===5)break}
  let k=1;while(out.length<5){const v=correct*(1+0.25*Math.ceil(k/2)*(k%2?1:-1));k++;if(v<=0||v>=max)continue;const s=f(v);if(!seen.has(s)){seen.add(s);out.push(s)}}
  const sh=R.shuffle(r,out);return{alts:sh,ans:sh.indexOf(cs)};
}
function txtQ(r,correct,wrongs){const sh=R.shuffle(r,[correct,...wrongs.slice(0,4)]);return{alts:sh,ans:sh.indexOf(correct)}}
const AR_ALTS=[
 'As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.',
 'As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.',
 'A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.',
 'A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.',
 'As asserções I e II são proposições falsas.'];
const arQ=k=>({alts:AR_ALTS,ans:LET.indexOf(k)});
const arEnun=(i,ii)=>`<p>Considerando o contexto apresentado, avalie as asserções a seguir e a relação proposta entre elas.</p><p><b>I.</b> ${i}</p><p class="porque">PORQUE</p><p><b>II.</b> ${ii}</p><p>A respeito dessas asserções, assinale a opção correta.</p>`;
const RM_POOL=['I, apenas.','II, apenas.','III, apenas.','I e II, apenas.','I e III, apenas.','II e III, apenas.','I, II e III.'];
function rmQ(r,correct){const o=R.shuffle(r,RM_POOL.filter(x=>x!==correct)).slice(0,4);const alts=[correct,...o].sort((a,b)=>RM_POOL.indexOf(a)-RM_POOL.indexOf(b));return{alts,ans:alts.indexOf(correct)}}
const rmEnun=(intro,a)=>`<p>${intro}</p><p><b>I.</b> ${a[0]}</p><p><b>II.</b> ${a[1]}</p><p><b>III.</b> ${a[2]}</p><p>É correto o que se afirma em</p>`;

/* ================= banco de questões ================= */
const TIPOS={ME:'Múltipla escolha',AR:'Asserção-razão',RM:'Resposta múltipla'};
const BANK=[
/* ---------- FORMAÇÃO GERAL ---------- */
{area:'FG',tema:'Formação Geral',tipo:'ME',gen:r=>({
 contexto:'A Agenda 2030 da ONU reúne 17 Objetivos de Desenvolvimento Sustentável (ODS). Em diversos municípios brasileiros, uma parcela significativa da população ainda não tem acesso à coleta e ao tratamento de esgoto, o que afeta diretamente a saúde pública e a qualidade dos corpos hídricos.',
 enunciado:'O ODS que trata diretamente da universalização do acesso à água potável e ao esgotamento sanitário é o',
 ...txtQ(r,'ODS 6 — Água potável e saneamento.',['ODS 11 — Cidades e comunidades sustentáveis.','ODS 13 — Ação contra a mudança global do clima.','ODS 7 — Energia limpa e acessível.','ODS 3 — Saúde e bem-estar.']),

AU('Conforto Ambiental','ME',r=>{
 const ec=R.pick(r,[0.10,0.12,0.14,0.19]),ei=R.pick(r,[0,0.02,0.03,0.05]),ea=0.025;
 const Rc=ec/1.75,Ra=2*ea/1.15,Ri=ei/0.040,RT=0.13+0.04+Rc+Ra+Ri,U=1/RT,semR=1/(Rc+Ra+Ri);

 coment:`R<sub>T</sub> = R<sub>si</sub> + Σe/λ + R<sub>se</sub> = 0,13 + ${nf(Rc,3)} (concreto) + ${nf(Ra,3)} (reboco)${ei?` + ${nf(Ri,3)} (EPS)`:''} + 0,04 = ${nf(RT,3)} m²·K/W. U = 1/R<sub>T</sub> = ${nf(U,2)} W/(m²·K). Quanto menor U, menor o fluxo de calor pela parede.`}},true),

EP('Pesquisa Operacional','ME',r=>{
 let c1,c2,a1,b1,R1,a2,b2,R2,x,y;
 do{c1=R.int(r,2,9)*5;c2=R.int(r,2,9)*5;a1=R.int(r,1,4);b1=R.int(r,1,4);a2=R.int(r,1,4);b2=R.int(r,1,4);R1=R.int(r,8,24)*5;R2=R.int(r,8,24)*5;const det=a1*b2-a2*b1;x=det?(R1*b2-R2*b1)/det:-1;y=det?(a1*R2-a2*R1)/det:-1}while(!(x>0&&y>0));
 const V=[[0,0],[Math.min(R1/a1,R2/a2),0],[0,Math.min(R1/b1,R2/b2)],[x,y]],Z=V.map(([u,v])=>c1*u+c2*v),Zm=Math.max(...Z);
 return{contexto:`Uma marcenaria produz mesas (x) e cadeiras (y), com lucro unitário de R$ ${c1} e R$ ${c2}, respectivamente. A produção está sujeita às restrições semanais: ${a1}x + ${b1}y ≤ ${R1} (horas de corte) e ${a2}x + ${b2}y ≤ ${R2} (horas de acabamento), com x, y ≥ 0.`,
 enunciado:'O lucro semanal máximo é, aproximadamente,',
 ...numQ(r,{correct:Zm,wrongs:[...Z.filter(z=>Math.abs(z-Zm)>0.01&&z>0),c1*R1/a1+c2*R2/b2,(c1+c2)*Math.min(x,y)],dec:2,pre:'R$ '}),
 coment:`Vértices da região viável: (0; 0), (${nf(V[1][0],2)}; 0), (0; ${nf(V[2][1],2)}) e a interseção das restrições (${nf(x,2)}; ${nf(y,2)}). Lucros: ${Z.map(z=>nf(z,2)).join('; ')}. O ótimo de um problema linear está em um vértice: Z<sub>máx</sub> = R$ ${nf(Zm,2)}.`}},true),
EP('Pesquisa Operacional','ME',r=>{

 const D=R.int(r,24,120)*100,S=R.int(r,8,40)*10,H=d2(r,2,10),Q=Math.sqrt(2*D*S/H),d=D/250,LT=R.int(r,3,12),ES=Math.round(d*R.int(r,2,5)),PP=d*LT+ES,CT=D/Q*S+Q/2*H;
 return{contexto:`Um componente tem demanda anual de ${D.toLocaleString('pt-BR')} unidades (250 dias úteis). Cada pedido custa R$ ${S},00, o custo anual de manutenção é de R$ ${nf(H,2)} por unidade, o prazo de entrega é de ${LT} dias úteis e o estoque de segurança é de ${ES} unidades.`,
 enunciado:'a) Calcule o lote econômico e o custo anual total de pedir e manter estoque. (valor: 6,0 pontos)<br>b) Calcule o ponto de pedido e explique a função do estoque de segurança. (valor: 4,0 pontos)',
 padrao:`a) LEC = √(2 × ${D} × ${S}/${nf(H,2)}) = ${nf(Q,0)} unidades. Custo = (D/Q)·S + (Q/2)·H = ${nf(D/Q*S,2)} + ${nf(Q/2*H,2)} = R$ ${nf(CT,2)}.<br>b) d = ${D}/250 = ${nf(d,1)} un./dia. PP = ${nf(d,1)} × ${LT} + ${ES} = ${nf(PP,0)} unidades. O estoque de segurança absorve variações da demanda e do prazo de entrega, evitando ruptura durante a reposição.`,

);

/* ================= montagem da prova ================= */
function montar(seed,n,areas,temas,soME){
  const r=mulberry32(seed);
  let pool=BANK.map((q,i)=>({...q,i})).filter(q=>areas.includes(q.area)&&(q.area==='FG'||cursoDe(q)===CURSO)&&(q.area==='FG'||!temas||temas.includes(q.tema))&&(!soME||q.tipo==='ME'));
  let sel=[];
  if(areas.length===2){ // proporção do ENADE: 1/4 FG, 3/4 CE
    const nFG=Math.max(1,Math.round(n*8/35)),nCE=n-nFG;
    sel=[...pick(r,pool.filter(q=>q.area==='FG'),nFG),...pick(r,pool.filter(q=>q.area==='CE'),nCE)];
  } else sel=pick(r,pool,n);
  return sel.map(q=>{const g=q.gen(r);return{...g,area:q.area,tema:q.tema,tipo:TIPOS[q.tipo],ref:q.ref}});
}
function pick(r,pool,n){
  let s=R.shuffle(r,pool).slice(0,n);
  const par=pool.filter(q=>q.param);
  while(s.length<n&&par.length)s.push(R.pick(r,par)); // completa com questões paramétricas
  return R.shuffle(r,s);
}

function iniciar(qs){S.qs=qs;S.k=0;S.resp=[];startTimer();render()}
function render(){
  const q=S.qs[S.k],n=S.qs.length,fb=S.modo==='estudar';
  app.innerHTML=`<div class="card">
   <div class="qhead"><div><span class="tag">${q.area==='FG'?'Formação Geral':'Componente Específico'}</span>${q.area==="CE"?`<span class="tag">${q.tema}</span>`:""}<span class="tag">${q.tipo}</span>${q.ref?`<span class="tag">Modelo ${q.ref}</span>`:''}</div>
   <div class="timer">Questão ${S.k+1} de ${n} · <span id="tm">${fmtT((performance.now()-S.t0)/1000)}</span></div></div>
   <div class="bar"><i style="width:${S.k/n*100}%"></i></div>
   <div class="base"><small>Texto-base</small>${q.contexto}</div>
   <div class="enun">${q.enunciado.startsWith('<p>')?q.enunciado:`<p>${q.enunciado}</p>`}</div>
   <div class="alts">${q.alts.map((a,i)=>`<button class="alt" data-i="${i}"><span class="l">${LET[i]}</span><span>${a}</span></button>`).join('')}</div>
   <div id="fb"></div>
   <div class="row"><button class="btn" id="nx" disabled>${fb?'Próxima':'Confirmar e avançar'}</button><button class="btn ghost" onclick="if(confirm('Sair e perder o progresso?'))home()">Sair</button></div>
  </div>`;
  let sel=null;const btns=[...app.querySelectorAll('.alt')],nx=document.getElementById('nx');
  btns.forEach(b=>b.onclick=()=>{
    if(fb&&sel!==null)return;
    sel=+b.dataset.i;btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');nx.disabled=false;
    if(fb){btns.forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('ok');else if(i===sel)x.classList.add('bad')});
      document.getElementById('fb').innerHTML=`<div class="coment"><b class="${sel===q.ans?'okc':'badc'}">${sel===q.ans?'Correto.':'Incorreto.'}</b> Gabarito: ${LET[q.ans]}.<br>${q.coment}</div>`;}
  });
  nx.onclick=()=>{S.resp.push(sel);S.k++;if(S.k<n)render();else fim()};
}
function fim(){
  S.tempo=stopTimer();
  if(S.modo==='simulado'&&S.disc&&S.discPick){prepDisc(S.discPick);return discursivaTela(true)}
  if(S.modo==='simulado'&&S.disc){const rr=mulberry32(Date.now()%1e9),fg=discIdx().filter(i=>DISC[i].area==='FG'),ce=discIdx().filter(i=>DISC[i].area==='CE');prepDisc([R.pick(rr,fg),...R.shuffle(rr,ce).slice(0,2)]);return discursivaTela(true)}
  relatorio();
}

/* ---- Discursivas ---- */
function prepDisc(lista){S.discList=lista.map(i=>{const d=DISC[i];return d.gen?{...d.gen(mulberry32(Date.now()%1e9+i)),area:d.area,tema:d.tema,ref:d.ref}:d});S.discIdx=0;S.discNotas=[]}
function discursivas(){S={modo:'disc'};prepDisc(discIdx());discursivaTela(false)}
function discursivaTela(noSimulado){
  const d=S.discList[S.discIdx],N=S.discList.length;
  app.innerHTML=`<div class="card">
   <div class="qhead"><div><span class="tag">${d.area==='FG'?'Formação Geral':'Componente Específico'}</span>${d.area==="CE"?`<span class="tag">${d.tema}</span>`:""}${d.ref?`<span class="tag">Modelo ${d.ref}</span>`:''}<span class="tag">Discursiva ${S.discIdx+1} de ${N}</span></div></div>
   <div class="base"><small>Texto-base</small>${d.contexto}</div>
   <div class="enun">${d.enunciado}</div>
   <textarea id="txt" placeholder="Escreva sua resposta (na prova, até 15 linhas)."></textarea>
   <div class="row"><button class="btn" id="ver">Ver padrão de resposta</button></div>
   <div id="pd"></div></div>`;
  document.getElementById('ver').onclick=()=>{
    document.getElementById('ver').disabled=true;document.getElementById('txt').readOnly=true;
    document.getElementById('pd').innerHTML=`<div class="coment"><b>Padrão de resposta</b><br>${d.padrao}</div>
    <h3>Autoavaliação — marque o que sua resposta contemplou</h3>
    <div class="rub">${d.rubrica.map(x=>`<label><input type="checkbox" data-p="${x[1]}"> <span>${x[0]} <span class="note">(${nf(x[1],1)} pt)</span></span></label>`).join('')}</div>
    <p>Nota: <b id="nt">0,0</b> / 10,0</p>
    <div class="row"><button class="btn" id="seg">${S.discIdx<N-1?'Próxima discursiva':(noSimulado?'Ver relatório':'Concluir')}</button></div>`;
    const cbs=[...document.querySelectorAll('.rub input')],upd=()=>{const s=cbs.filter(c=>c.checked).reduce((a,c)=>a+ +c.dataset.p,0);document.getElementById('nt').textContent=nf(s,1);return s};
    cbs.forEach(c=>c.onchange=upd);
    document.getElementById('seg').onclick=()=>{S.discNotas.push(upd());S.discIdx++;
      if(S.discIdx<N)discursivaTela(noSimulado);else if(noSimulado)relatorio();else discFim()};
  };
}
function discTabela(){return `<table><tr><th>Questão</th><th>Tema</th><th>Nota</th></tr>${S.discList.map((d,i)=>`<tr><td>Discursiva ${i+1}</td><td>${d.area==='FG'?'Formação Geral':d.tema}</td><td>${nf(S.discNotas[i],1)} / 10</td></tr>`).join('')}</table>`}
function discFim(){
  app.innerHTML=`<div class="card"><h2>Discursivas concluídas</h2>${discTabela()}
  <div class="row"><button class="btn" onclick="discursivas()">Refazer com novos valores</button><button class="btn ghost" onclick="home()">Início</button></div></div>`;
}

/* ---- Relatório ---- */
function relatorio(){
  const qs=S.qs,ac=qs.filter((q,i)=>S.resp[i]===q.ans).length,n=qs.length,pct=ac/n*100;
  const grp=key=>{const m={};qs.forEach((q,i)=>{const k=q[key];m[k]=m[k]||{a:0,t:0};m[k].t++;if(S.resp[i]===q.ans)m[k].a++});return m};
  const tabela=(m,tit)=>`<h3>${tit}</h3><table><tr><th>${tit.split(' ').pop()}</th><th>Acertos</th><th style="width:35%"></th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${k}</td><td>${v.a}/${v.t}</td><td><div class="mini"><i style="width:${v.a/v.t*100}%"></i></div></td></tr>`).join('')}</table>`;
  const areaM={};qs.forEach((q,i)=>{const k=q.area==='FG'?'Formação Geral':'Componente Específico';areaM[k]=areaM[k]||{a:0,t:0};areaM[k].t++;if(S.resp[i]===q.ans)areaM[k].a++});
  let comp='';
  if(S.modo==='competicao'){
    const sec=Math.round(S.tempo),h=hash(`${S.nome}|${S.code}|${ac}|${n}|${sec}|oswy`);
    const line=`GRADUAR | ${S.code} | ${S.nome} | ${ac}/${n} | ${fmtT(sec)} | ${h}`;
    S.envio={codigo:S.code,nome:S.nome,acertos:ac,total:n,tempo:sec,verificacao:h};
    comp=`<div class="card noprint"><h2>Seu resultado na competição</h2>
    <div id="envStatus" class="coment" style="transform:none">${API_URL?'Enviando seu resultado ao professor...':'Envie a linha abaixo ao professor.'}</div>
    <div class="codebox" style="font-size:.95rem;text-align:left">${esc(line)}</div>
    <div class="row"><button class="btn" id="cp">Copiar resultado</button><a class="btn ghost" style="text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(line)}">Enviar pelo WhatsApp</a>${API_URL?'<button class="btn ghost" id="reenv">Tentar enviar de novo</button>':''}</div></div>`;
  }
  const disc=S.discNotas&&S.discNotas.length?`<h3>Discursivas (autoavaliação)</h3>${discTabela()}`:'';
  let notaE='';
  if(S.completa&&S.discNotas&&S.discNotas.length){
    const pc=a=>{const qq=qs.map((q,i)=>[q,i]).filter(([q])=>q.area===a);return qq.length?qq.filter(([q,i])=>S.resp[i]===q.ans).length/qq.length*100:0};
    const dm=a=>{const v=S.discList.map((d,i)=>[d,S.discNotas[i]]).filter(([d])=>d.area===a).map(x=>x[1]*10);return v.length?v.reduce((x,y)=>x+y,0)/v.length:0};
    const oF=pc('FG'),oE=pc('CE'),dF=dm('FG'),dE=dm('CE'),FG=0.6*oF+0.4*dF,CE=0.85*oE+0.15*dE,T=0.25*FG+0.75*CE;
    notaE=`<div class="card"><h2>Nota estimada — critério ENADE</h2>
    <div class="big"><div class="stat"><b>${nf(T,1)}</b><span>nota geral (0 a 100)</span></div><div class="stat"><b>${nf(FG,1)}</b><span>Formação Geral</span></div><div class="stat"><b>${nf(CE,1)}</b><span>Componente Específico</span></div></div>
    <table><tr><th>Parte</th><th>Desempenho</th><th>Peso na parte</th></tr>
    <tr><td>Objetivas de Formação Geral</td><td>${nf(oF,1)}%</td><td>60%</td></tr>
    <tr><td>Discursivas de Formação Geral</td><td>${nf(dF,1)}%</td><td>40%</td></tr>
    <tr><td>Objetivas do Componente Específico</td><td>${nf(oE,1)}%</td><td>85%</td></tr>
    <tr><td>Discursivas do Componente Específico</td><td>${nf(dE,1)}%</td><td>15%</td></tr></table>
    <p class="note">Nota geral = 25% × Formação Geral + 75% × Componente Específico. As discursivas entram pela sua autoavaliação na rubrica.</p></div>`;
  }
  app.innerHTML=`${comp}${notaE}<div class="card">
   <h2>Relatório ${S.modo==='competicao'?'— '+S.nome:''}</h2>
   <div class="big">
    <div class="stat"><b>${ac}/${n}</b><span>acertos</span></div>
    <div class="stat"><b>${nf(pct,0)}%</b><span>aproveitamento</span></div>
    <div class="stat"><b>${fmtT(S.tempo)}</b><span>tempo total</span></div>
    <div class="stat"><b>${fmtT(S.tempo/n)}</b><span>média por questão</span></div>
   </div>
   ${tabela(areaM,'Por componente')}${tabela(grp('tema'),'Por tema')}${tabela(grp('tipo'),'Por tipo')}${disc}
   <h3>Revisão das questões</h3>
   ${qs.map((q,i)=>`<details><summary><span class="${S.resp[i]===q.ans?'okc':'badc'}">${S.resp[i]===q.ans?'✔':'✘'}</span> Questão ${i+1} — ${q.tema} <span class="note">(${q.tipo})</span></summary>
     <div class="base" style="margin-top:10px">${q.contexto}</div>${q.enunciado.startsWith('<p>')?q.enunciado:`<p>${q.enunciado}</p>`}
     <p>Sua resposta: <b>${S.resp[i]==null?'—':LET[S.resp[i]]+') '+q.alts[S.resp[i]]}</b><br>Gabarito: <b>${LET[q.ans]}) ${q.alts[q.ans]}</b></p>
     <div class="coment">${q.coment}</div></details>`).join('')}
   <div class="row"><button class="btn" onclick="window.print()">Imprimir / PDF</button><button class="btn ghost" onclick="home()">Início</button></div></div>`;
  if(S.modo==='competicao'&&API_URL){
    const st=document.getElementById('envStatus'),rb=document.getElementById('reenv');
    const enviar=()=>{st.innerHTML='Enviando seu resultado ao professor...';
      apiEnviar(S.envio).then(r=>{
        if(r.ok){st.innerHTML=`<b class="okc">✔ Resultado registrado.</b> ${r.posicao?`Você está em <b>${r.posicao}º</b> de ${r.participantes} no momento.`:''}${r.duplicado?' (Seu primeiro envio já estava registrado; ele foi mantido.)':''}`;if(rb)rb.style.display='none'}
        else st.innerHTML=`<b class="badc">✘ Não registrado:</b> ${esc(r.erro||'erro desconhecido')}. Envie a linha abaixo ao professor.`;
      }).catch(()=>{st.innerHTML='<b class="badc">✘ Sem conexão com a planilha.</b> Clique em "Tentar enviar de novo" ou envie a linha abaixo ao professor.'})};
    if(!S.enviado){S.enviado=true;enviar()}else st.innerHTML='Resultado já enviado nesta sessão.';
    if(rb)rb.onclick=enviar;
  }
  const cp=document.getElementById('cp');
  if(cp)cp.onclick=()=>{navigator.clipboard.writeText(app.querySelector('.codebox').textContent).then(()=>cp.textContent='Copiado!')};
}


/* ---- fórmulas a lápis no fundo ---- */
const FORM={EC:['M = qL²/8','σ = N/A','Q = C·i·A/360','Fr = V/√(g·y)','2e + p = 63','I = bh³/12','Q = k·i·A','f<sub>cd</sub> = f<sub>ck</sub>/1,4','Cu = D₆₀/D₁₀','v₁A₁ = v₂A₂','p = γ·h','ΣF = 0','ΣM = 0','R<sub>h</sub> = A/P','T = 1/P','n = e/(1+e)'],
 AU:['CA = A<sub>c</sub>/A<sub>lote</sub>','TO = A<sub>proj</sub>/A<sub>lote</sub>','i = h/c · 100','2e + p = 63','U = 1/R<sub>T</sub>','R = e/λ','L = 10·log Σ10<sup>L/10</sup>','ΔL = 20·log(r₂/r₁)','1:50','1:100','Ø 1,50 m','0,80 × 1,20','hab/ha','h ≈ L/10','N ↑','8,33%'],
 EP:['VPL = Σ FC/(1+i)ⁿ','LEC = √(2DS/H)','PE = CF/(P − CV)','OEE = D·P·Q','takt = T<sub>disp</sub>/D','C<sub>pk</sub>','X̄ ± A₂R̄','W = 1/(μ − λ)','PP = d·LT + ES','F = αD + (1−α)F','TP = TN·FT','máx Z = c·x','PDCA','ABC','TF = N·10⁶/HHT','Q = kAΔT/L']};
function desenhaFundo(){const F=FORM[CURSO||'EC'],box=document.getElementById('bgf'),rr=mulberry32(7);box.innerHTML='';
 F.concat(F.slice(0,4)).forEach((f,i,a)=>{const sp=document.createElement('span');sp.innerHTML=f;sp.style.left=(rr()*92)+'%';sp.style.top=(i/a.length*96+rr()*3)+'%';sp.style.fontSize=(16+rr()*20)+'px';sp.style.transform=`rotate(${(rr()-0.5)*24}deg)`;box.appendChild(sp)});}
desenhaFundo();

/* ---- tema ---- */
const tb=document.getElementById('themeBtn');
tb.onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';tb.textContent=d?'Tema escuro':'Tema claro'};
home();
</script>
